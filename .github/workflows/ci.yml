name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      # 1. Client (Next.js) installieren, linten und bauen
      - name: Install Client Dependencies
        run: |
          cd client
          npm ci

      - name: Lint Client
        run: |
          cd client
          npm run lint

      - name: Check Code Formatting (Prettier)
        run: |
          cd client
          npm run format:check

      - name: Build Client
        run: |
          cd client
          npm run build

      # 2. Server (Express) installieren / testen
      - name: Install Server Dependencies
        run: |
          cd server
          npm ci
