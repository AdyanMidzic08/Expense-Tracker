name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Falls du ein Root-Package.json hast oder getrennte Ordner:
      # Hier ein Beispiel für den Client:
      - name: Install Client Dependencies
        run: |
          cd expense_client # Passe den Ordnernamen an, falls er bei dir anders heißt
          npm ci

      - name: Build Client
        run: |
          cd expense_client
          npm run build

      # Falls du auch Backend-Tests oder Build-Schritte hast:
      - name: Install Server Dependencies
        run: |
          cd backend # Passe den Ordnernamen an, falls er bei dir anders heißt
          npm ci
