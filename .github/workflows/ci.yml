name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          # Da die Lock-Dateien in den Unterordnern liegen, müssen wir das Caching explizit aufteilen oder für den Root deaktivieren. 
          # Am sichersten ist es, das automatische Caching hier wegzulassen oder pro Ordner zu machen:

      # 1. Client (Next.js) bauen
      - name: Install Client Dependencies
        run: |
          cd client
          npm ci

      - name: Build Client
        run: |
          cd client
          npm run build

      # 2. Server (Express) testen / bauen (falls ein Build-Skript existiert)
      - name: Install Server Dependencies
        run: |
          cd server
          npm ci
